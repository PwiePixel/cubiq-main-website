# Cubiq Studio – statische Website (siehe Dockerfile). Läuft hinter cloudflared: HTTPS endet bei Cloudflare,
# hier kommt nur HTTP aus dem internen Docker-Netz an.

# Log ohne IP-Adressen und Browser-Kennungen, Pfad ohne Query (siehe Datenschutzerklärung).
log_format studio '$time_iso8601 $request_method "$uri" $status $body_bytes_sent ${request_time}s';

# Dateien unter /assets tragen ?v=<Version> – nach einem Update gibt es neue Adressen, also darf lange gecacht werden.
map $uri $studio_cache {
    ~^/assets/  "public, max-age=604800";
    ~^/api/     "";
    default     "no-cache";
}

# Team-Bereich und Schnittstelle nie in Suchmaschinen (ohne Eintrag in robots.txt – der würde /admin verraten).
map $uri $studio_robots {
    ~^/(admin|api)  "noindex, nofollow";
    default         "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    access_log /dev/stdout studio;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header Cache-Control $studio_cache always;
    add_header X-Robots-Tag $studio_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # www.cubiq.studio → cubiq.studio
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Versionsnummern: schreibt deploy/studio-server.sh (morgens und abends) nach /opt/cubiq/studio-data.
    location = /data/feed.json {
        alias /srv/data/feed.json;
    }

    # Team-Server (api/server.mjs) im internen Netz. Adresse erst bei der Anfrage auflösen – so startet nginx auch,
    # wenn der Team-Server gerade neu startet.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $studio_api http://studio-api:3000;
        proxy_pass $studio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        client_max_body_size 64k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /login {
        return 301 /admin;
    }

    # Saubere Adressen: /impressum statt /impressum.html. Geprüft wird die Adresse von außen ($request_uri) –
    # interne Weiterleitungen (index.html, Fehlerseite) bleiben unberührt.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /;
    }
    if ($request_uri ~ ^/([^?]+)\.html(\?.*)?$) {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404 {
        return 404;
    }
    location = /404.html {
        internal;
    }
}
