<!doctype html>
<html lang="de">
<head>
  <!--#include head-->
  <title data-en="Team – Cubiq Studio">Team – Cubiq Studio</title>
  <meta name="description" content="Die Menschen hinter Cubiq Studio." data-en-content="The people behind Cubiq Studio.">
  <link rel="canonical" href="%%SITE_URL%%/team">
</head>
<body>
  <!--#include header-->

  <main id="main">
    <section class="page-head">
      <div class="scene scene-fill" aria-hidden="true">
        <div class="scene-base"></div>
        <div class="scene-grid"></div>
        <div class="scene-cubes"></div>
        <div class="scene-glow"></div>
      </div>
      <div class="container">
        <span class="kicker">Cubiq Studio</span>
        <h1 class="display page-title">Team</h1>
        <p class="lead page-lead" data-en="The people behind Cubiq Studio.">Die Menschen hinter Cubiq Studio.</p>
      </div>
    </section>

    <!-- Die Mitglieder kommen aus dem Team-Bereich (/admin) – dort anlegen, sortieren und bearbeiten. -->
    <section class="container" aria-label="Team">
      <ul class="team-grid" data-team></ul>
      <p class="team-empty" data-team-empty hidden data-en="The team will introduce itself here soon.">Hier stellt sich bald das Team vor.</p>
      <noscript><p class="team-empty">Für die Team-Seite bitte JavaScript einschalten.</p></noscript>

      <div class="card cta">
        <div>
          <h2 class="heading" data-en="Want to join in?">Lust, mitzumachen?</h2>
          <p data-en="Write to us – we're happy about new people and ideas.">Schreib uns – wir freuen uns über neue Leute und Ideen.</p>
        </div>
        <a href="/#kontakt" class="btn btn-primary btn-md"><svg class="icon"><use href="#i-mail"/></svg><span data-en="Contact">Kontakt</span></a>
      </div>
    </section>
  </main>

  <!--#include footer-->
</body>
</html>
